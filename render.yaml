# Despliegue en Render (https://render.com): New + → Blueprint → elige este repositorio.
services:
  - type: web
    name: nba-bets
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn nba_bets.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ODDS_API_KEY
        sync: false          # Render te la pedirá al crear el servicio
      - key: APP_PASSWORD
        sync: false          # contraseña para entrar en la web
      - key: ODDS_REGIONS
        value: eu
      - key: ENABLE_SCRAPERS
        value: "1"
